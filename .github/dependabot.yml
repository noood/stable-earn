version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      cloudflare-toolchain:
        patterns:
          - "@cloudflare/vite-plugin"
          - "@cloudflare/workers-types"
          - "wrangler"
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
