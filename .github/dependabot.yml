version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      cloudflare-toolchain:
        patterns:
          - "@cloudflare/vite-plugin"
          - "@cloudflare/workers-types"
          - "wrangler"
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      vinext:
        patterns:
          - "vinext"
          - "@vinext/*"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
